<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pride Texture Remapper (Luminance Based)</title>
<style>
body{
    margin:0;
    background:#0f0f12;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    text-align:center;
}
h1{
    margin:20px 0;
    font-weight:normal;
}
#container{
    width:90%;
    max-width:1100px;
    margin:auto;
}
#drop{
    border:2px dashed #555;
    padding:40px;
    margin-bottom:20px;
    border-radius:12px;
    background:#1a1a1f;
    cursor:pointer;
}
#drop.dragover{
    border-color:#fff;
}
canvas{
    max-width:100%;
    border-radius:12px;
    background:#000;
}
select,button{
    margin:10px;
    padding:8px 12px;
    border-radius:6px;
    border:none;
    background:#2a2a30;
    color:#fff;
}
button:hover{
    background:#444;
}
</style>
</head>
<body>

<h1>Pride Texture Remapper</h1>

<div id="container">

<div id="drop">Drop Image Here or Click to Upload</div>
<input type="file" id="fileInput" accept="image/*" hidden>

<select id="flagSelect"></select>
<button id="downloadBtn">Download</button>

<br>
<canvas id="canvas"></canvas>

</div>

<script>
const flags = {

"Transgender":["#5BCFFB","#F5A9B8","#FFFFFF","#F5A9B8","#5BCFFB"],

"Progress Pride":[
"#000000","#784F17","#E40303","#FF8C00",
"#FFED00","#008026","#004DFF","#750787",
"#5BCFFB","#F5A9B8","#FFFFFF"
],

"Rainbow":[
"#E40303","#FF8C00","#FFED00",
"#008026","#004DFF","#750787"
],

"Bisexual":["#D60270","#9B4F96","#0038A8"],

"Pansexual":["#FF1B8D","#FFD900","#1BB3FF"],

"Lesbian":["#D62900","#FF9B55","#FFFFFF","#D462A6","#A50062"],

"Gay Men":["#078D70","#26CEAA","#98E8C1","#FFFFFF","#7BADE2","#5049CC","#3D1A78"],

"Asexual":["#000000","#A4A4A4","#FFFFFF","#810081"],

"Aromantic":["#3DA542","#A7D379","#FFFFFF","#A9A9A9","#000000"],

"Aroace":["#E28C00","#FDDC5C","#FFFFFF","#62AEDC","#203856"],

"Non-Binary":["#FFF430","#FFFFFF","#9C59D1","#000000"],

"Genderfluid":["#FF75A2","#FFFFFF","#BE18D6","#000000","#333EBD"],

"Genderqueer":["#B57EDC","#FFFFFF","#4A8123"],

"Agender":["#000000","#BABABA","#FFFFFF","#B9F484","#FFFFFF","#BABABA","#000000"],

"Demisexual":["#000000","#A4A4A4","#FFFFFF","#810081"],

"Intersex":["#FFD800","#7A00AC"],

"Bigender":["#C479A2","#EDA5CD","#FFFFFF","#9AC7E8","#6D82D1"]

};

const select = document.getElementById("flagSelect");
Object.keys(flags).forEach(f=>{
    const option=document.createElement("option");
    option.value=f;
    option.textContent=f;
    select.appendChild(option);
});

const drop=document.getElementById("drop");
const fileInput=document.getElementById("fileInput");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let originalImage=null;

drop.addEventListener("click",()=>fileInput.click());

drop.addEventListener("dragover",(e)=>{
    e.preventDefault();
    drop.classList.add("dragover");
});
drop.addEventListener("dragleave",()=>drop.classList.remove("dragover"));

drop.addEventListener("drop",(e)=>{
    e.preventDefault();
    drop.classList.remove("dragover");
    handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change",(e)=>{
    handleFile(e.target.files[0]);
});

function handleFile(file){
    const reader=new FileReader();
    reader.onload=function(e){
        const img=new Image();
        img.onload=function(){
            canvas.width=img.width;
            canvas.height=img.height;
            ctx.drawImage(img,0,0);
            originalImage=img;
            remap();
        }
        img.src=e.target.result;
    }
    reader.readAsDataURL(file);
}

select.addEventListener("change",remap);

function remap(){
    if(!originalImage) return;

    ctx.drawImage(originalImage,0,0);
    let imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
    let data=imageData.data;

    const palette=flags[select.value].map(hexToRgb);

    for(let i=0;i<data.length;i+=4){
        let r=data[i];
        let g=data[i+1];
        let b=data[i+2];

        // perceptual luminance
        let lum=(0.2126*r+0.7152*g+0.0722*b)/255;

        // map luminance to gradient
        let idx=lum*(palette.length-1);
        let low=Math.floor(idx);
        let high=Math.ceil(idx);
        let t=idx-low;

        let c1=palette[low];
        let c2=palette[high];

        data[i]=c1.r+(c2.r-c1.r)*t;
        data[i+1]=c1.g+(c2.g-c1.g)*t;
        data[i+2]=c1.b+(c2.b-c1.b)*t;
    }

    ctx.putImageData(imageData,0,0);
}

function hexToRgb(hex){
    hex=hex.replace("#","");
    return {
        r:parseInt(hex.substring(0,2),16),
        g:parseInt(hex.substring(2,4),16),
        b:parseInt(hex.substring(4,6),16)
    };
}

document.getElementById("downloadBtn").addEventListener("click",()=>{
    const link=document.createElement("a");
    link.download="remapped.png";
    link.href=canvas.toDataURL();
    link.click();
});
</script>

</body>
</html>
