<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pride Texture Remapper – Perceptual Mapping</title>
<style>
body{
    background:#0e0e0e;
    color:#f0f0f0;
    font-family:system-ui, sans-serif;
    text-align:center;
    padding:30px;
}
h2{
    font-weight:500;
}
.controls{
    margin-bottom:20px;
}
select,input,button{
    padding:8px 12px;
    margin:6px;
    border-radius:6px;
    border:none;
}
button{
    cursor:pointer;
}
canvas{
    max-width:95%;
    border-radius:10px;
    margin-top:20px;
}
</style>
</head>
<body>

<h2>Pride Texture Remapper (Perceptual Luminance)</h2>

<div class="controls">
<input type="file" id="upload" accept="image/*">
<select id="flagSelect"></select>
<button onclick="processImage()">Remap</button>
<button onclick="downloadImage()">Download</button>
</div>

<canvas id="canvas"></canvas>

<script>

// ---------------------------
// COMPLETE FLAG SET
// ---------------------------

const flags = {
"Transgender": ["#5BCEFA","#F5A9B8","#FFFFFF","#F5A9B8","#5BCEFA"],
"Progress Pride": ["#000000","#784F17","#5BCEFA","#F5A9B8","#FFFFFF","#F5A9B8","#5BCEFA","#E40303","#FF8C00","#FFED00","#008026","#004DFF","#750787"],
"Rainbow": ["#E40303","#FF8C00","#FFED00","#008026","#004DFF","#750787"],
"Bisexual": ["#D60270","#9B4F96","#0038A8"],
"Pansexual": ["#FF1B8D","#FFD900","#1BB3FF"],
"Lesbian": ["#D52D00","#FF9A56","#FFFFFF","#D362A4","#A30262"],
"Gay Men": ["#078D70","#26CEAA","#98E8C1","#FFFFFF","#7BADE2","#5049CC","#3D1A78"],
"Asexual": ["#000000","#A3A3A3","#FFFFFF","#800080"],
"Aromantic": ["#3DA542","#A7D379","#FFFFFF","#A9A9A9","#000000"],
"Aroace": ["#E28C00","#ECC26B","#FFFFFF","#62AEDC","#203856"],
"Non-Binary": ["#FFF430","#FFFFFF","#9C59D1","#000000"],
"Genderfluid": ["#FF75A2","#FFFFFF","#BE18D6","#000000","#333EBD"],
"Genderqueer": ["#B57EDC","#FFFFFF","#4A8123"],
"Agender": ["#000000","#B9B9B9","#FFFFFF","#B9B9B9","#000000","#B8F483","#000000"],
"Demisexual": ["#000000","#A3A3A3","#FFFFFF","#800080"],
"Intersex": ["#FFD800","#7902AA"],
"Bigender": ["#C479A2","#EDA5CD","#FFFFFF","#9AC7E8","#6D82D1"]
};

// populate dropdown
const select = document.getElementById("flagSelect");
Object.keys(flags).forEach(name=>{
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
});

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let img = new Image();

// ---------------------------
// IMAGE LOAD
// ---------------------------

document.getElementById("upload").addEventListener("change", e=>{
    const reader = new FileReader();
    reader.onload = evt=>{
        img.onload = ()=>{
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img,0,0);
        };
        img.src = evt.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
});

// ---------------------------
// PERCEPTUAL LUMINANCE
// ---------------------------

// true linear luminance
function getLuminance(r,g,b){
    r/=255; g/=255; b/=255;

    r = r<=0.04045 ? r/12.92 : Math.pow((r+0.055)/1.055,2.4);
    g = g<=0.04045 ? g/12.92 : Math.pow((g+0.055)/1.055,2.4);
    b = b<=0.04045 ? b/12.92 : Math.pow((b+0.055)/1.055,2.4);

    return 0.2126*r + 0.7152*g + 0.0722*b;
}

// ---------------------------
// COLOR HELPERS
// ---------------------------

function hexToRgb(hex){
    hex = hex.replace("#","");
    return [
        parseInt(hex.substring(0,2),16),
        parseInt(hex.substring(2,4),16),
        parseInt(hex.substring(4,6),16)
    ];
}

function interpolatePalette(palette,t){
    const n = palette.length-1;
    const idx = t*n;
    const i = Math.floor(idx);
    const f = idx-i;

    if(i>=n) return hexToRgb(palette[n]);

    const c1 = hexToRgb(palette[i]);
    const c2 = hexToRgb(palette[i+1]);

    return [
        c1[0] + (c2[0]-c1[0])*f,
        c1[1] + (c2[1]-c1[1])*f,
        c1[2] + (c2[2]-c1[2])*f
    ];
}

// ---------------------------
// MAIN PROCESS
// ---------------------------

function processImage(){
    if(!img.src) return;

    ctx.drawImage(img,0,0);
    const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const data = imageData.data;

    const palette = flags[select.value];

    for(let i=0;i<data.length;i+=4){

        const r=data[i];
        const g=data[i+1];
        const b=data[i+2];

        let lum = getLuminance(r,g,b);

        // preserve contrast curve
        lum = Math.pow(lum,0.9);

        const newColor = interpolatePalette(palette,lum);

        data[i]=newColor[0];
        data[i+1]=newColor[1];
        data[i+2]=newColor[2];
    }

    ctx.putImageData(imageData,0,0);
}

// ---------------------------
// DOWNLOAD
// ---------------------------

function downloadImage(){
    const link = document.createElement("a");
    link.download = "remapped.png";
    link.href = canvas.toDataURL();
    link.click();
}

</script>
</body>
</html>
